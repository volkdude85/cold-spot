name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  daemon:
    name: daemon (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: test (race)
        run: go test -race ./...

      - name: cross-compile for a phone
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o /tmp/libnoragated.so .
          file /tmp/libnoragated.so
          test -s /tmp/libnoragated.so

  tls:
    name: tls proxy (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tls
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tls/go.mod

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: cross-compile for a phone
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o /tmp/libnoragatetls.so .
          test -s /tmp/libnoragatetls.so

  smoke:
    name: daemon answers, proxies, and refuses when told to
    runs-on: ubuntu-latest
    needs: daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: build and run it for real
        working-directory: daemon
        run: |
          go build -o /tmp/coldspotd .
          /tmp/coldspotd \
            -socks 127.0.0.1:18080 -proxy 127.0.0.1:18081 -state 127.0.0.1:18082 \
            -config /tmp/ci.json -egress-probe 0 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18082/state >/dev/null && break
            sleep 1
          done

      - name: the API answers and the guard is honest about being off
        run: |
          curl -sf http://127.0.0.1:18082/state | tee /tmp/state.json
          grep -q '"state":"disabled"' /tmp/state.json

      - name: OPTIONS is answered with CORS (the panel depends on it)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H 'Access-Control-Request-Method: POST' http://127.0.0.1:18082/config)
          test "$code" = "204"

      - name: a real request goes through the proxy leg
        run: |
          curl -sf -x http://127.0.0.1:18081 https://example.com -o /tmp/page.html
          grep -qi '<title>' /tmp/page.html

      - name: a real request goes through the SOCKS leg
        run: |
          curl -sf --socks5-hostname 127.0.0.1:18080 https://example.com -o /tmp/page2.html
          grep -qi '<title>' /tmp/page2.html

      - name: the guard refuses a client when the exit is not the expected one
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"expect_egress":["203.0.113.0/24"],"block_on_leak":true}' \
            http://127.0.0.1:18082/config
          sleep 1
          if curl -s -o /dev/null -w '%{http_code}' -x http://127.0.0.1:18081 https://example.com | grep -q 200; then
            echo "guard did not refuse a leak"; exit 1
          fi
          echo "guard refused, as it should"

      - name: server log
        if: always()
        run: cat /tmp/coldspotd.log 2>/dev/null || true
