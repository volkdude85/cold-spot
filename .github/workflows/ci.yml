name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  daemon:
    name: daemon (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: test (race)
        run: go test -race ./...

      - name: cross-compile for a phone
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o /tmp/libnoragated.so .
          file /tmp/libnoragated.so
          test -s /tmp/libnoragated.so

  tls:
    name: tls proxy (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tls
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tls/go.mod

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: cross-compile for a phone
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o /tmp/libnoragatetls.so .
          test -s /tmp/libnoragatetls.so

  smoke:
    name: daemon answers, proxies, and refuses when told to
    runs-on: ubuntu-latest
    needs: daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: build
        working-directory: daemon
        run: go build -o /tmp/coldspotd .

      # One step, because a background process started in one step is not reliably
      # alive in the next one. The script is also runnable locally, which is the
      # only way to know this job is right before pushing it.
      - name: run the real thing and assert on it
        run: ./scripts/smoke.sh /tmp/coldspotd

      - name: daemon log on failure
        if: failure()
        run: tail -50 /tmp/coldspotd.log || true
